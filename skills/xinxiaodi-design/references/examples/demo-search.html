<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>信小递 - 搜索页</title>
<link rel="stylesheet" href="../ui.css">
<style>
html { background: #333333; }
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'PingFang SC', -apple-system, sans-serif;
  background: #FFFFFF;
  width: 375px; margin: 0 auto; min-height: 100vh; overflow-x: hidden;
}

/* 绿色搜索头部（状态栏 + 标题栏 + 搜索框） */
.search-header {
  background: linear-gradient(90deg, #00B7AC 0%, #009B97 100%);
  padding-bottom: 12px;
}

/* 头部内的即时搜索框（白底，放大镜 + 输入 + 清除×，无查询按钮） */
.search-field {
  height: 36px; margin: 0 16px; background: #FFFFFF; border-radius: 4px;
  display: flex; align-items: center; gap: 6px; padding: 0 8px;
}
.search-field__icon { width: 16px; height: 16px; flex-shrink: 0; }
.search-field__input {
  flex: 1; border: none; background: transparent; outline: none;
  font-size: 14px; line-height: 22px; color: #1D2129;
}
.search-field__input::placeholder { color: #C9CDD4; }
.search-field__clear { width: 16px; height: 16px; flex-shrink: 0; cursor: pointer; display: none; }
.search-field__clear--visible { display: block; }

/* 正文 */
.search-body { min-height: calc(100vh - 132px); }

/* 空状态 */
.empty-state {
  display: flex; align-items: center; justify-content: center;
  min-height: calc(100vh - 260px);
  font-size: 14px; color: #86909C;
}

/* 结果计数 */
.result-count {
  text-align: right; font-size: 12px; color: #86909C;
  padding: 12px 16px 4px;
}

/* 结果列表 */
.result-list { padding: 0 16px; }
.result-item { padding: 12px 0; border-bottom: 0.5px solid #F2F3F5; cursor: pointer; }
.result-item--selected { background: #E8FFFB; margin: 0 -16px; padding: 12px 16px; }
.result-item__line1 { font-size: 14px; line-height: 20px; color: #1D2129; }
.result-item__line2 {
  font-size: 12px; line-height: 18px; color: #86909C; margin-top: 4px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.result-item .hl { color: #00AAA6; }

.home-indicator {
  position: fixed; bottom: 8px; left: 50%; transform: translateX(-50%);
  width: 134px; height: 5px; background: #000000; border-radius: 999px; z-index: 50;
}
</style>
</head>
<body>

<!-- 绿色搜索头部 -->
<div class="search-header">
  <div class="statusbar statusbar--light">
    <span class="statusbar__time">9:41</span>
    <div class="statusbar__icons">
      <img src="../assets/icons/bar_status_white.svg" height="12" alt="status icons" />
    </div>
  </div>
  <div class="titlebar titlebar--transparent">
    <button class="titlebar__back" onclick="navigateBack()" aria-label="返回">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
        <path d="M15 6L9 12L15 18" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <span class="titlebar__title">搜索</span>
    <span class="titlebar__right titlebar__capsule">
      <img src="../assets/icons/iPhoneX/miniapp/bar_navbar_transparent.svg" height="32" alt="miniapp capsule" />
    </span>
  </div>
  <div class="search-field">
    <img class="search-field__icon" src="../assets/icons/search_gray_16px.svg" alt="搜索" />
    <input class="search-field__input" id="q" type="text" placeholder="请输入收货方编码/名" oninput="onSearch()" />
    <img class="search-field__clear" id="clearBtn" src="../assets/icons/close_gray_full_16px.svg" alt="清除" onclick="clearSearch()" />
  </div>
</div>

<!-- 正文（由 JS 按输入切换：空状态 / 2行结果 / 1行结果） -->
<div class="search-body" id="body"></div>

<div class="home-indicator"></div>

<script src="../ui.js"></script>
<script>
// —— mock 数据 ——
// 2 行结果（收货方编码，示例查询 "Y8080"）
var DATA_2LINE = [
  { code: 'RRRR7-2018577RRRR7', addr: '河北省邯郸市武安金龙RRRR7海信海信海信海信专海信物流园区' },
  { code: 'Y8080-2018577Y8080', addr: '河北省邯郸市武安金龙Y8080海信海信海信海信专海信物流园区' },
  { code: 'RRRR7-2018577RRRR7', addr: '河北省邯郸市武安金龙RRRR7海信海信海信海信专海信物流园区' },
  { code: 'Y8080-2018577Y8080', addr: '河北省邯郸市武安金龙Y8080海信海信海信海信专海信物流园区' },
  { code: 'RRRR7-2018577RRRR7', addr: '河北省邯郸市武安金龙RRRR7海信海信海信海信专海信物流园区' },
  { code: 'RRRR7-2018577RRRR7', addr: '河北省邯郸市武安金龙RRRR7海信海信海信海信专海信物流园区' },
  { code: 'RRRR7-2018577RRRR7', addr: '河北省邯郸市武安金龙RRRR7海信海信海信海信专海信物流园区' }
];
// 1 行结果（收货方名称，示例查询 "江门基地调度中心"）
var DATA_1LINE = [
  '江门基地调度中心', '江门基地调度中心(股份)', '江门基地调度中心', '江门基地调度中心(股份)',
  '江门基地调度中心', '江门基地调度中心(股份)', '江门基地调度中心', '江门基地调度中心', '江门基地调度中心'
];

function esc(s) { return s.replace(/[&<>]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]; }); }
function hl(text, q) {
  if (!q) return esc(text);
  var i = text.indexOf(q);
  if (i < 0) return esc(text);
  return esc(text.slice(0, i)) + '<span class="hl">' + esc(q) + '</span>' + esc(text.slice(i + q.length));
}

function renderEmpty() {
  document.getElementById('body').innerHTML =
    '<div class="empty-state">未找到符合条件的单据</div>';
}
function render2line(q) {
  var rows = DATA_2LINE.map(function(it) {
    return '<div class="result-item">' +
      '<div class="result-item__line1">' + hl(it.code, q) + '</div>' +
      '<div class="result-item__line2">' + hl(it.addr, q) + '</div>' +
    '</div>';
  }).join('');
  document.getElementById('body').innerHTML =
    '<div class="result-count">收货方数据：共19条</div>' +
    '<div class="result-list">' + rows + '</div>';
}
function render1line(q) {
  var rows = DATA_1LINE.map(function(name, idx) {
    var cls = idx === 1 ? 'result-item result-item--selected' : 'result-item';
    return '<div class="' + cls + '"><div class="result-item__line1">' + hl(name, q) + '</div></div>';
  }).join('');
  document.getElementById('body').innerHTML = '<div class="result-list">' + rows + '</div>';
}

function onSearch() {
  var q = document.getElementById('q').value.trim();
  var clear = document.getElementById('clearBtn');
  clear.classList.toggle('search-field__clear--visible', q.length > 0);

  if (!q) { renderEmpty(); return; }
  // 命中 2 行结果集（收货方编码，如 Y8080 / RRRR7）
  if (DATA_2LINE.some(function(it){ return it.code.indexOf(q) >= 0 || it.addr.indexOf(q) >= 0; })) {
    render2line(q);
  // 命中 1 行结果集（收货方名称，如 江门）
  } else if (DATA_1LINE.some(function(n){ return n.indexOf(q) >= 0; })) {
    render1line(q);
  } else {
    renderEmpty();
  }
}

function clearSearch() {
  var input = document.getElementById('q');
  input.value = '';
  input.focus();
  onSearch();
}

function navigateBack() {
  if (window.parent !== window) {
    window.parent.postMessage({ action: 'navigate', target: 'back' }, '*');
  } else {
    history.length > 1 ? history.back() : (window.location.href = 'demo-list.html');
  }
}

// 初始为默认空状态
renderEmpty();
</script>

</body>
</html>
